# Memoria para el proceso que compila. Kotlin y el procesador de Room piden bastante;
# con el valor por defecto la compilación puede quedarse sin memoria a medio camino.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compila los módulos en paralelo y reutiliza resultados de compilaciones anteriores.
# Con :logica y :app separados se nota.
org.gradle.parallel=true
org.gradle.caching=true

# Obligatorio: todas las librerías del proyecto (Room, Compose, WorkManager) son AndroidX.
android.useAndroidX=true

# Cada módulo genera solo sus propios recursos en R, sin arrastrar los de sus dependencias.
android.nonTransitiveRClass=true

kotlin.code.style=official
